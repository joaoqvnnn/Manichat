<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header do App -->
    <header class="app-header">
        <div class="app-header-container">
            <div class="app-logo">
                <a href="../app/dashboard.html"></a>
            </div>
            
            <div class="app-header-actions">
                <button class="app-notification-btn">
                    <i class="fas fa-bell"></i>
                    <span class="notification-count">3</span>
                </button>
                
                <div class="app-user-menu">
                    <button class="app-user-avatar">
                        <img src="../../assets/images/usuarios/avatar.jpg" alt="">
                        <span></span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="app-user-dropdown">
                        <a href="../app/dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                        <a href="../autenticacao/login.html"><i class="fas fa-sign-out-alt"></i> Sair</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="channel-stories-main">
        <div class="channel-stories-container">
            
            <!-- Sidebar do Canal -->
            <aside class="channel-sidebar">
                <div class="channel-sidebar-header">
                    <div class="channel-icon instagram">
                        <i class="fab fa-instagram"></i>
                    </div>
                    <h3>Instagram</h3>
                    <span class="status-badge connected">Conectado</span>
                </div>
                
                <nav class="channel-nav">
                    <a href="configuracoes.html">
                        <i class="fas fa-cog"></i> Configurações
                    </a>
                    <a href="mensagens.html">
                        <i class="fas fa-comments"></i> Mensagens
                    </a>
                    <a href="comentarios.html">
                        <i class="fas fa-comment-dots"></i> Comentários
                    </a>
                    <a href="stories.html" class="active">
                        <i class="fas fa-book-open"></i> Stories
                    </a>
                </nav>
            </aside>
            
            <!-- Conteúdo Principal -->
            <main class="channel-content">
                
                <!-- Cabeçalho -->
                <div class="channel-content-header">
                    <div>
                        <h1>Stories</h1>
                        <p></p>
                    </div>
                </div>
                
                <!-- Lista de Stories -->
                <div class="stories-list">
                    
                    <!-- Story 1 -->
                    <div class="story-card">
                        <div class="story-preview">
                            <img src="../../assets/images/stories/story1.jpg" alt="">
                        </div>
                        <div class="story-info">
                            <h3></h3>
                            <p><i class="far fa-clock"></i> </p>
                            <p><i class="fas fa-eye"></i> visualizações</p>
                            <p><i class="fas fa-reply"></i> respostas</p>
                        </div>
                    </div>
                    
                    <!-- Story 2 -->
                    <div class="story-card">
                        <div class="story-preview">
                            <img src="../../assets/images/stories/story2.jpg" alt="">
                        </div>
                        <div class="story-info">
                            <h3></h3>
                            <p><i class="far fa-clock"></i> </p>
                            <p><i class="fas fa-eye"></i> visualizações</p>
                            <p><i class="fas fa-reply"></i> respostas</p>
                        </div>
                    </div>
                    
                    <!-- Story 3 -->
                    <div class="story-card">
                        <div class="story-preview">
                            <img src="../../assets/images/stories/story3.jpg" alt="">
                        </div>
                        <div class="story-info">
                            <h3></h3>
                            <p><i class="far fa-clock"></i> </p>
                            <p><i class="fas fa-eye"></i> visualizações</p>
                            <p><i class="fas fa-reply"></i> respostas</p>
                        </div>
                    </div>
                </div>
                
                <!-- Configurações de Automação -->
                <div class="story-automation-settings">
                    <h2>Automação de Stories</h2>
                    
                    <div class="settings-toggle-item">
                        <div class="toggle-info">
                            <h3>Responder mentions automaticamente</h3>
                            <p></p>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    
                    <div class="settings-toggle-item">
                        <div class="toggle-info">
                            <h3>Salvar respostas de stories</h3>
                            <p></p>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
            </main>
        </div>
    </section>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
