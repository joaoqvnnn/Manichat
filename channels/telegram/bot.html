<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header do App -->
    <header class="app-header">
        <div class="app-header-container">
            <div class="app-logo">
                <a href="../app/dashboard.html"></a>
            </div>
            
            <div class="app-header-actions">
                <button class="app-notification-btn">
                    <i class="fas fa-bell"></i>
                    <span class="notification-count">3</span>
                </button>
                
                <div class="app-user-menu">
                    <button class="app-user-avatar">
                        <img src="../../assets/images/usuarios/avatar.jpg" alt="">
                        <span></span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="app-user-dropdown">
                        <a href="../app/dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                        <a href="../autenticacao/login.html"><i class="fas fa-sign-out-alt"></i> Sair</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="channel-bot-main">
        <div class="channel-bot-container">
            
            <!-- Sidebar do Canal -->
            <aside class="channel-sidebar">
                <div class="channel-sidebar-header">
                    <div class="channel-icon telegram">
                        <i class="fab fa-telegram"></i>
                    </div>
                    <h3>Telegram</h3>
                    <span class="status-badge connected">Conectado</span>
                </div>
                
                <nav class="channel-nav">
                    <a href="configuracoes.html">
                        <i class="fas fa-cog"></i> Configurações
                    </a>
                    <a href="bot.html" class="active">
                        <i class="fas fa-robot"></i> Bot
                    </a>
                    <a href="mensagens.html">
                        <i class="fas fa-comments"></i> Mensagens
                    </a>
                    <a href="contatos.html">
                        <i class="fas fa-users"></i> Contatos
                    </a>
                    <a href="automacoes.html">
                        <i class="fas fa-robot"></i> Automações
                    </a>
                </nav>
            </aside>
            
            <!-- Conteúdo Principal -->
            <main class="channel-content">
                
                <!-- Cabeçalho -->
                <div class="channel-content-header">
                    <h1>Configurações do Bot</h1>
                    <p></p>
                </div>
                
                <!-- Informações do Bot -->
                <div class="bot-info-card">
                    <div class="bot-avatar">
                        <img src="../../assets/images/integracoes/telegram-avatar.jpg" alt="">
                    </div>
                    <div class="bot-info">
                        <h2></h2>
                        <p>@</p>
                        <span class="status-badge active">Online</span>
                    </div>
                    <button class="btn-test-bot">
                        <i class="fas fa-paper-plane"></i> Testar Bot
                    </button>
                </div>
                
                <!-- Comandos -->
                <div class="form-section">
                    <h2>Comandos do Bot</h2>
                    
                    <div class="commands-list">
                        
                        <!-- Comando 1 -->
                        <div class="command-item">
                            <div class="command-info">
                                <span class="command-name">/start</span>
                                <p></p>
                            </div>
                            <button class="btn-edit-command"><i class="fas fa-edit"></i></button>
                        </div>
                        
                        <!-- Comando 2 -->
                        <div class="command-item">
                            <div class="command-info">
                                <span class="command-name">/help</span>
                                <p></p>
                            </div>
                            <button class="btn-edit-command"><i class="fas fa-edit"></i></button>
                        </div>
                        
                        <!-- Comando 3 -->
                        <div class="command-item">
                            <div class="command-info">
                                <span class="command-name">/menu</span>
                                <p></p>
                            </div>
                            <button class="btn-edit-command"><i class="fas fa-edit"></i></button>
                        </div>
                    </div>
                    
                    <button class="btn-add-command">
                        <i class="fas fa-plus"></i> Adicionar Comando
                    </button>
                </div>
                
                <!-- Teclado -->
                <div class="form-section">
                    <h2>Teclado Personalizado</h2>
                    
                    <div class="keyboard-config">
                        <div class="keyboard-row">
                            <button class="keyboard-button">Botão 1</button>
                            <button class="keyboard-button">Botão 2</button>
                        </div>
                        <div class="keyboard-row">
                            <button class="keyboard-button">Botão 3</button>
                        </div>
                        
                        <button class="btn-add-keyboard-row">
                            <i class="fas fa-plus"></i> Adicionar Linha
                        </button>
                    </div>
                </div>
                
                <!-- Botões -->
                <div class="form-actions">
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-save"></i> Salvar Bot
                    </button>
                </div>
            </main>
        </div>
    </section>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
