<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header do App -->
    <header class="app-header">
        <div class="app-header-container">
            <div class="app-logo">
                <a href="../app/dashboard.html"></a>
            </div>
            
            <div class="app-header-actions">
                <button class="app-notification-btn">
                    <i class="fas fa-bell"></i>
                    <span class="notification-count">3</span>
                </button>
                
                <div class="app-user-menu">
                    <button class="app-user-avatar">
                        <img src="../../assets/images/usuarios/avatar.jpg" alt="">
                        <span></span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="app-user-dropdown">
                        <a href="../app/dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                        <a href="../autenticacao/login.html"><i class="fas fa-sign-out-alt"></i> Sair</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="channel-templates-main">
        <div class="channel-templates-container">
            
            <!-- Sidebar do Canal -->
            <aside class="channel-sidebar">
                <div class="channel-sidebar-header">
                    <div class="channel-icon whatsapp">
                        <i class="fab fa-whatsapp"></i>
                    </div>
                    <h3>WhatsApp</h3>
                    <span class="status-badge connected">Conectado</span>
                </div>
                
                <nav class="channel-nav">
                    <a href="configuracoes.html">
                        <i class="fas fa-cog"></i> Configurações
                    </a>
                    <a href="templates.html" class="active">
                        <i class="fas fa-file-alt"></i> Templates
                    </a>
                    <a href="mensagens.html">
                        <i class="fas fa-comments"></i> Mensagens
                    </a>
                    <a href="contatos.html">
                        <i class="fas fa-users"></i> Contatos
                    </a>
                    <a href="automacoes.html">
                        <i class="fas fa-robot"></i> Automações
                    </a>
                </nav>
            </aside>
            
            <!-- Conteúdo Principal -->
            <main class="channel-content">
                
                <!-- Cabeçalho -->
                <div class="channel-content-header">
                    <div>
                        <h1>Templates de Mensagem</h1>
                        <p></p>
                    </div>
                    <button class="btn-primary">
                        <i class="fas fa-plus"></i> Novo Template
                    </button>
                </div>
                
                <!-- Filtros -->
                <div class="app-filters">
                    <button class="template-filter active">Todos</button>
                    <button class="template-filter">Aprovados</button>
                    <button class="template-filter">Pendentes</button>
                    <button class="template-filter">Rejeitados</button>
                </div>
                
                <!-- Lista de Templates -->
                <div class="templates-list">
                    
                    <!-- Template 1 -->
                    <div class="template-card">
                        <div class="template-header">
                            <div class="template-icon">
                                <i class="fas fa-file-alt"></i>
                            </div>
                            <div class="template-info">
                                <h3></h3>
                                <p>Categoria: </p>
                                <p>Idioma: </p>
                            </div>
                            <span class="status-badge approved">Aprovado</span>
                        </div>
                        
                        <div class="template-content-preview">
                            <p></p>
                        </div>
                        
                        <div class="template-actions">
                            <button class="btn-edit"><i class="fas fa-edit"></i> Editar</button>
                            <button class="btn-duplicate"><i class="fas fa-copy"></i> Duplicar</button>
                            <button class="btn-delete"><i class="fas fa-trash"></i> Excluir</button>
                        </div>
                    </div>
                    
                    <!-- Template 2 -->
                    <div class="template-card">
                        <div class="template-header">
                            <div class="template-icon">
                                <i class="fas fa-file-alt"></i>
                            </div>
                            <div class="template-info">
                                <h3></h3>
                                <p>Categoria: </p>
                                <p>Idioma: </p>
                            </div>
                            <span class="status-badge approved">Aprovado</span>
                        </div>
                        
                        <div class="template-content-preview">
                            <p></p>
                        </div>
                        
                        <div class="template-actions">
                            <button class="btn-edit"><i class="fas fa-edit"></i> Editar</button>
                            <button class="btn-duplicate"><i class="fas fa-copy"></i> Duplicar</button>
                            <button class="btn-delete"><i class="fas fa-trash"></i> Excluir</button>
                        </div>
                    </div>
                    
                    <!-- Template 3 - Pendente -->
                    <div class="template-card">
                        <div class="template-header">
                            <div class="template-icon">
                                <i class="fas fa-file-alt"></i>
                            </div>
                            <div class="template-info">
                                <h3></h3>
                                <p>Categoria: </p>
                                <p>Idioma: </p>
                            </div>
                            <span class="status-badge pending">Pendente</span>
                        </div>
                        
                        <div class="template-content-preview">
                            <p></p>
                        </div>
                        
                        <div class="template-actions">
                            <button class="btn-edit"><i class="fas fa-edit"></i> Editar</button>
                            <button class="btn-delete"><i class="fas fa-trash"></i> Excluir</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </section>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
