<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header do App -->
    <header class="app-header">
        <div class="app-header-container">
            <div class="app-logo">
                <a href="../app/dashboard.html"></a>
            </div>
            
            <div class="app-header-actions">
                <button class="app-notification-btn">
                    <i class="fas fa-bell"></i>
                    <span class="notification-count">3</span>
                </button>
                
                <div class="app-user-menu">
                    <button class="app-user-avatar">
                        <img src="../../assets/images/usuarios/avatar.jpg" alt="">
                        <span></span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="app-user-dropdown">
                        <a href="../app/dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                        <a href="../autenticacao/login.html"><i class="fas fa-sign-out-alt"></i> Sair</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="channel-connect-main">
        <div class="channel-connect-container">
            
            <!-- Cabeçalho -->
            <div class="channel-connect-header">
                <a href="../app/integracoes.html" class="btn-back">
                    <i class="fas fa-arrow-left"></i> Voltar
                </a>
                <h1>Conectar WhatsApp</h1>
            </div>
            
            <!-- Card de Conexão -->
            <div class="channel-connect-card">
                
                <!-- Ícone -->
                <div class="channel-icon whatsapp">
                    <i class="fab fa-whatsapp"></i>
                </div>
                
                <!-- Título -->
                <h2>Conectar seu WhatsApp</h2>
                <p></p>
                
                <!-- Métodos de Conexão -->
                <div class="connection-methods">
                    <div class="connection-method-card">
                        <div class="method-icon">
                            <i class="fas fa-qrcode"></i>
                        </div>
                        <h3>QR Code</h3>
                        <p></p>
                        <button class="btn-connect-qrcode">
                            <i class="fas fa-qrcode"></i> Conectar via QR Code
                        </button>
                    </div>
                    
                    <div class="connection-method-card">
                        <div class="method-icon">
                            <i class="fas fa-mobile-alt"></i>
                        </div>
                        <h3>Número de Telefone</h3>
                        <p></p>
                        <button class="btn-connect-phone">
                            <i class="fas fa-phone"></i> Conectar via Número
                        </button>
                    </div>
                </div>
                
                <!-- Benefícios -->
                <div class="channel-benefits">
                    <div class="benefit-item">
                        <i class="fas fa-check-circle"></i>
                        <p></p>
                    </div>
                    
                    <div class="benefit-item">
                        <i class="fas fa-check-circle"></i>
                        <p></p>
                    </div>
                    
                    <div class="benefit-item">
                        <i class="fas fa-check-circle"></i>
                        <p></p>
                    </div>
                </div>
                
                <!-- Observações -->
                <div class="channel-notes">
                    <i class="fas fa-info-circle"></i>
                    <p></p>
                </div>
            </div>
            
            <!-- Passos de Conexão -->
            <div class="connection-steps">
                <h2>Como funciona</h2>
                
                <div class="step-item">
                    <div class="step-number">1</div>
                    <div class="step-content">
                        <h3></h3>
                        <p></p>
                    </div>
                </div>
                
                <div class="step-item">
                    <div class="step-number">2</div>
                    <div class="step-content">
                        <h3></h3>
                        <p></p>
                    </div>
                </div>
                
                <div class="step-item">
                    <div class="step-number">3</div>
                    <div class="step-content">
                        <h3></h3>
                        <p></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
