<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header do App -->
    <header class="app-header">
        <div class="app-header-container">
            <div class="app-logo">
                <a href="../app/dashboard.html"></a>
            </div>
            
            <div class="app-header-actions">
                <button class="app-notification-btn">
                    <i class="fas fa-bell"></i>
                    <span class="notification-count">3</span>
                </button>
                
                <div class="app-user-menu">
                    <button class="app-user-avatar">
                        <img src="../../assets/images/usuarios/avatar.jpg" alt="">
                        <span></span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="app-user-dropdown">
                        <a href="../app/dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                        <a href="../autenticacao/login.html"><i class="fas fa-sign-out-alt"></i> Sair</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="channel-settings-main">
        <div class="channel-settings-container">
            
            <!-- Sidebar do Canal -->
            <aside class="channel-sidebar">
                <div class="channel-sidebar-header">
                    <div class="channel-icon whatsapp">
                        <i class="fab fa-whatsapp"></i>
                    </div>
                    <h3>WhatsApp</h3>
                    <span class="status-badge connected">Conectado</span>
                </div>
                
                <nav class="channel-nav">
                    <a href="configuracoes.html" class="active">
                        <i class="fas fa-cog"></i> Configurações
                    </a>
                    <a href="templates.html">
                        <i class="fas fa-file-alt"></i> Templates
                    </a>
                    <a href="mensagens.html">
                        <i class="fas fa-comments"></i> Mensagens
                    </a>
                    <a href="contatos.html">
                        <i class="fas fa-users"></i> Contatos
                    </a>
                    <a href="automacoes.html">
                        <i class="fas fa-robot"></i> Automações
                    </a>
                </nav>
            </aside>
            
            <!-- Conteúdo Principal -->
            <main class="channel-content">
                
                <!-- Cabeçalho -->
                <div class="channel-content-header">
                    <h1>Configurações do WhatsApp</h1>
                    <p></p>
                </div>
                
                <!-- Conta Conectada -->
                <div class="form-section">
                    <h2>Conta Conectada</h2>
                    
                    <div class="connected-account-card">
                        <div class="account-avatar">
                            <img src="../../assets/images/integracoes/whatsapp-avatar.jpg" alt="">
                        </div>
                        <div class="account-info">
                            <h3></h3>
                            <p>+55 </p>
                            <span class="status-badge verified">
                                <i class="fas fa-check-circle"></i> Verificado
                            </span>
                        </div>
                        <button class="btn-disconnect">
                            <i class="fas fa-unlink"></i> Desconectar
                        </button>
                    </div>
                </div>
                
                <!-- Configurações de Mensagens -->
                <div class="form-section">
                    <h2>Configurações de Mensagens</h2>
                    
                    <div class="settings-toggle-item">
                        <div class="toggle-info">
                            <h3>Resposta Automática</h3>
                            <p></p>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    
                    <div class="settings-toggle-item">
                        <div class="toggle-info">
                            <h3>Mensagem de Ausência</h3>
                            <p></p>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    
                    <div class="settings-toggle-item">
                        <div class="toggle-info">
                            <h3>Confirmação de Leitura</h3>
                            <p></p>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
                
                <!-- Horário de Atendimento -->
                <div class="form-section">
                    <h2>Horário de Atendimento</h2>
                    
                    <div class="form-group">
                        <label>Dias de Funcionamento</label>
                        <div class="days-selector">
                            <label class="day-checkbox">
                                <input type="checkbox" checked> Seg
                            </label>
                            <label class="day-checkbox">
                                <input type="checkbox" checked> Ter
                            </label>
                            <label class="day-checkbox">
                                <input type="checkbox" checked> Qua
                            </label>
                            <label class="day-checkbox">
                                <input type="checkbox" checked> Qui
                            </label>
                            <label class="day-checkbox">
                                <input type="checkbox" checked> Sex
                            </label>
                            <label class="day-checkbox">
                                <input type="checkbox" checked> Sáb
                            </label>
                            <label class="day-checkbox">
                                <input type="checkbox"> Dom
                            </label>
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Horário de Início</label>
                            <input type="time" value="08:00">
                        </div>
                        
                        <div class="form-group">
                            <label>Horário de Fim</label>
                            <input type="time" value="20:00">
                        </div>
                    </div>
                </div>
                
                <!-- Botões -->
                <div class="form-actions">
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-save"></i> Salvar Configurações
                    </button>
                </div>
            </main>
        </div>
    </section>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
