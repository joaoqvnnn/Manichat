<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-body">
    <!-- Header Simplificado -->
    <header class="auth-header">
        <div class="auth-header-container">
            <div class="logo">
                <a href="../home/index.html"></a>
            </div>
            <a href="../home/index.html" class="btn-back-home">
                <i class="fas fa-arrow-left"></i> Voltar ao Site
            </a>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="auth-main">
        <div class="auth-container">
            <div class="auth-box auth-box-wide">
                
                <!-- Cabeçalho do Formulário -->
                <div class="auth-box-header">
                    <div class="auth-icon">
                        <i class="fas fa-user-plus"></i>
                    </div>
                    <h1>Criar Conta</h1>
                    <p></p>
                </div>
                
                <!-- Formulário de Cadastro -->
                <form class="auth-form">
                    
                    <!-- Dados Pessoais -->
                    <div class="form-section">
                        <h3>Dados Pessoais</h3>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cadastro-nome">Nome Completo *</label>
                                <div class="input-with-icon">
                                    <i class="fas fa-user"></i>
                                    <input type="text" id="cadastro-nome" name="nome" required>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="cadastro-cpf">CPF *</label>
                                <div class="input-with-icon">
                                    <i class="fas fa-id-card"></i>
                                    <input type="text" id="cadastro-cpf" name="cpf" placeholder="000.000.000-00" required>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cadastro-data-nascimento">Data de Nascimento *</label>
                                <div class="input-with-icon">
                                    <i class="fas fa-calendar"></i>
                                    <input type="date" id="cadastro-data-nascimento" name="data_nascimento" required>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="cadastro-genero">Gênero</label>
                                <div class="input-with-icon">
                                    <i class="fas fa-venus-mars"></i>
                                    <select id="cadastro-genero" name="genero">
                                        <option value="">Selecione...</option>
                                        <option value="feminino">Feminino</option>
                                        <option value="masculino">Masculino</option>
                                        <option value="outro">Outro</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Dados de Contato -->
                    <div class="form-section">
                        <h3>Dados de Contato</h3>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cadastro-email">E-mail *</label>
                                <div class="input-with-icon">
                                    <i class="fas fa-envelope"></i>
                                    <input type="email" id="cadastro-email" name="email" required>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="cadastro-telefone">Telefone *</label>
                                <div class="input-with-icon">
                                    <i class="fas fa-phone"></i>
                                    <input type="tel" id="cadastro-telefone" name="telefone" required>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Dados de Acesso -->
                    <div class="form-section">
                        <h3>Dados de Acesso</h3>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="cadastro-senha">Senha *</label>
                                <div class="input-with-icon">
                                    <i class="fas fa-lock"></i>
                                    <input type="password" id="cadastro-senha" name="senha" required>
                                    <button type="button" class="btn-toggle-password">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label for="cadastro-confirmar-senha">Confirmar Senha *</label>
                                <div class="input-with-icon">
                                    <i class="fas fa-lock"></i>
                                    <input type="password" id="cadastro-confirmar-senha" name="confirmar_senha" required>
                                    <button type="button" class="btn-toggle-password">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Termos -->
                    <div class="form-group">
                        <label class="checkbox-container">
                            <input type="checkbox" name="termos" required>
                            <span class="checkmark"></span>
                            Li e aceito os <a href="../home/termos.html" target="_blank">Termos de Uso</a> e a <a href="../home/privacidade.html" target="_blank">Política de Privacidade</a> *
                        </label>
                    </div>
                    
                    <!-- Botão de Cadastro -->
                    <button type="submit" class="btn-auth-submit">
                        Criar Conta <i class="fas fa-user-plus"></i>
                    </button>
                </form>
                
                <!-- Divisor -->
                <div class="auth-divider">
                    <span>ou</span>
                </div>
                
                <!-- Cadastro Social -->
                <div class="social-auth">
                    <button class="btn-social google">
                        <i class="fab fa-google"></i>
                        Cadastrar com Google
                    </button>
                    
                    <button class="btn-social facebook">
                        <i class="fab fa-facebook"></i>
                        Cadastrar com Facebook
                    </button>
                </div>
                
                <!-- Link para Login -->
                <div class="auth-footer">
                    <p>Já tem uma conta? <a href="login.html">Faça Login</a></p>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Simplificado -->
    <footer class="auth-footer">
        <div class="auth-footer-container">
            <p>&copy; 2024 - Todos os direitos reservados</p>
            <div class="auth-footer-links">
                <a href="../home/termos.html">Termos</a>
                <a href="../home/privacidade.html">Privacidade</a>
                <a href="../home/contato.html">Contato</a>
            </div>
        </div>
    </footer>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
