<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-body">
    <!-- Header Simplificado -->
    <header class="auth-header">
        <div class="auth-header-container">
            <div class="logo">
                <a href="../home/index.html"></a>
            </div>
            <a href="../home/index.html" class="btn-back-home">
                <i class="fas fa-arrow-left"></i> Voltar ao Site
            </a>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="auth-main">
        <div class="auth-container">
            <div class="auth-box">
                
                <!-- Cabeçalho do Formulário -->
                <div class="auth-box-header">
                    <div class="auth-icon">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <h1>Login</h1>
                    <p></p>
                </div>
                
                <!-- Formulário de Login -->
                <form class="auth-form">
                    
                    <!-- Campo Email -->
                    <div class="form-group">
                        <label for="login-email">E-mail *</label>
                        <div class="input-with-icon">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="login-email" name="email" required>
                        </div>
                    </div>
                    
                    <!-- Campo Senha -->
                    <div class="form-group">
                        <label for="login-senha">Senha *</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="login-senha" name="senha" required>
                            <button type="button" class="btn-toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Opções Adicionais -->
                    <div class="form-options">
                        <label class="checkbox-container">
                            <input type="checkbox" name="lembrar">
                            <span class="checkmark"></span>
                            Lembrar de mim
                        </label>
                        <a href="recuperar-senha.html" class="forgot-password">Esqueceu a senha?</a>
                    </div>
                    
                    <!-- Botão de Login -->
                    <button type="submit" class="btn-auth-submit">
                        Entrar <i class="fas fa-sign-in-alt"></i>
                    </button>
                </form>
                
                <!-- Divisor -->
                <div class="auth-divider">
                    <span>ou</span>
                </div>
                
                <!-- Login Social -->
                <div class="social-auth">
                    <button class="btn-social google">
                        <i class="fab fa-google"></i>
                        Entrar com Google
                    </button>
                    
                    <button class="btn-social facebook">
                        <i class="fab fa-facebook"></i>
                        Entrar com Facebook
                    </button>
                </div>
                
                <!-- Link para Cadastro -->
                <div class="auth-footer">
                    <p>Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
                </div>
            </div>
            
            <!-- Sidebar com Benefícios -->
            <div class="auth-sidebar">
                <div class="auth-sidebar-content">
                    <h2></h2>
                    <p></p>
                    
                    <ul class="auth-benefits">
                        <li>
                            <i class="fas fa-robot"></i>
                            <div>
                                <h3></h3>
                                <p></p>
                            </div>
                        </li>
                        <li>
                            <i class="fas fa-bolt"></i>
                            <div>
                                <h3></h3>
                                <p></p>
                            </div>
                        </li>
                        <li>
                            <i class="fas fa-shield-alt"></i>
                            <div>
                                <h3></h3>
                                <p></p>
                            </div>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Simplificado -->
    <footer class="auth-footer">
        <div class="auth-footer-container">
            <p>&copy; 2024 - Todos os direitos reservados</p>
            <div class="auth-footer-links">
                <a href="../home/termos.html">Termos</a>
                <a href="../home/privacidade.html">Privacidade</a>
                <a href="../home/contato.html">Contato</a>
            </div>
        </div>
    </footer>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
