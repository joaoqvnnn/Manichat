<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-body">
    <!-- Header Simplificado -->
    <header class="auth-header">
        <div class="auth-header-container">
            <div class="logo">
                <a href="../home/index.html"></a>
            </div>
            <a href="../home/index.html" class="btn-back-home">
                <i class="fas fa-arrow-left"></i> Voltar ao Site
            </a>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="auth-main">
        <div class="recovery-container">
            <div class="recovery-box">
                
                <!-- Cabeçalho -->
                <div class="recovery-header">
                    <div class="recovery-icon">
                        <i class="fas fa-lock"></i>
                    </div>
                    <h1>Redefinir Senha</h1>
                    <p></p>
                </div>
                
                <!-- Passos de Recuperação -->
                <div class="recovery-steps">
                    <div class="step completed">
                        <div class="step-circle"><i class="fas fa-check"></i></div>
                        <span>Identificação</span>
                    </div>
                    <div class="step-line"></div>
                    <div class="step completed">
                        <div class="step-circle"><i class="fas fa-check"></i></div>
                        <span>Verificação</span>
                    </div>
                    <div class="step-line"></div>
                    <div class="step active">
                        <div class="step-circle">3</div>
                        <span>Nova Senha</span>
                    </div>
                </div>
                
                <!-- Formulário de Nova Senha -->
                <form class="recovery-form">
                    
                    <!-- Campo Nova Senha -->
                    <div class="form-group">
                        <label for="nova-senha">Nova Senha *</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="nova-senha" name="nova_senha" required>
                            <button type="button" class="btn-toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        
                        <!-- Requisitos de Senha -->
                        <div class="password-requirements">
                            <p>Sua senha deve conter:</p>
                            <ul>
                                <li><i class="fas fa-check"></i> Mínimo 8 caracteres</li>
                                <li><i class="fas fa-check"></i> Letras maiúsculas</li>
                                <li><i class="fas fa-check"></i> Números</li>
                            </ul>
                        </div>
                    </div>
                    
                    <!-- Campo Confirmar Senha -->
                    <div class="form-group">
                        <label for="confirmar-nova-senha">Confirmar Nova Senha *</label>
                        <div class="input-with-icon">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirmar-nova-senha" name="confirmar_nova_senha" required>
                            <button type="button" class="btn-toggle-password">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Botão de Redefinição -->
                    <button type="submit" class="btn-recovery-submit">
                        Redefinir Senha <i class="fas fa-check-circle"></i>
                    </button>
                </form>
                
                <!-- Links Adicionais -->
                <div class="recovery-links">
                    <p>Lembrou sua senha? <a href="login.html">Fazer Login</a></p>
                </div>
                
                <!-- Ajuda -->
                <div class="recovery-help">
                    <h3>Precisa de ajuda?</h3>
                    <p></p>
                    <div class="help-links">
                        <a href="../home/faq.html"><i class="fas fa-question-circle"></i> FAQ</a>
                        <a href="../home/contato.html"><i class="fas fa-headset"></i> Suporte</a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer Simplificado -->
    <footer class="auth-footer">
        <div class="auth-footer-container">
            <p>&copy; 2024 - Todos os direitos reservados</p>
            <div class="auth-footer-links">
                <a href="../home/termos.html">Termos</a>
                <a href="../home/privacidade.html">Privacidade</a>
                <a href="../home/contato.html">Contato</a>
            </div>
        </div>
    </footer>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
