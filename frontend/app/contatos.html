<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header do App -->
    <header class="app-header">
        <div class="app-header-container">
            <div class="app-logo">
                <a href="dashboard.html"></a>
            </div>
            
            <div class="app-header-actions">
                <button class="app-search-btn">
                    <i class="fas fa-search"></i>
                </button>
                
                <button class="app-notification-btn">
                    <i class="fas fa-bell"></i>
                    <span class="notification-count">3</span>
                </button>
                
                <div class="app-user-menu">
                    <button class="app-user-avatar">
                        <img src="../../assets/images/usuarios/avatar.jpg" alt="">
                        <span></span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="app-user-dropdown">
                        <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                        <a href="perfil.html"><i class="fas fa-user"></i> Perfil</a>
                        <a href="../autenticacao/login.html"><i class="fas fa-sign-out-alt"></i> Sair</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="app-main">
        <div class="app-container">
            
            <!-- Sidebar -->
            <aside class="app-sidebar">
                <nav class="app-nav">
                    <div class="app-nav-section">
                        <h3>Principal</h3>
                        <a href="dashboard.html">
                            <i class="fas fa-dashboard"></i> Dashboard
                        </a>
                        <a href="automacoes.html">
                            <i class="fas fa-robot"></i> Automações
                        </a>
                        <a href="contatos.html" class="active">
                            <i class="fas fa-users"></i> Contatos
                        </a>
                        <a href="mensagens.html">
                            <i class="fas fa-comments"></i> Mensagens
                        </a>
                    </div>
                    
                    <div class="app-nav-section">
                        <h3>Ferramentas</h3>
                        <a href="campanhas.html">
                            <i class="fas fa-bullhorn"></i> Campanhas
                        </a>
                        <a href="templates.html">
                            <i class="fas fa-file-alt"></i> Templates
                        </a>
                    </div>
                </nav>
            </aside>
            
            <!-- Conteúdo Principal -->
            <main class="app-content">
                
                <!-- Cabeçalho -->
                <div class="app-content-header">
                    <div>
                        <h1>Contatos</h1>
                        <p></p>
                    </div>
                    <button class="btn-add-contact">
                        <i class="fas fa-plus"></i> Adicionar Contato
                    </button>
                </div>
                
                <!-- Estatísticas -->
                <div class="app-stats-grid">
                    <div class="app-stat-card">
                        <i class="fas fa-users"></i>
                        <div>
                            <span class="app-stat-value"></span>
                            <span class="app-stat-label">Total de Contatos</span>
                        </div>
                    </div>
                    
                    <div class="app-stat-card">
                        <i class="fas fa-user-plus"></i>
                        <div>
                            <span class="app-stat-value"></span>
                            <span class="app-stat-label">Novos esta Semana</span>
                        </div>
                    </div>
                </div>
                
                <!-- Busca e Filtros -->
                <div class="app-filters">
                    <div class="app-search">
                        <input type="text" placeholder="Buscar contato...">
                        <button><i class="fas fa-search"></i></button>
                    </div>
                    
                    <select class="app-filter">
                        <option value="">Todas as Tags</option>
                    </select>
                </div>
                
                <!-- Lista de Contatos -->
                <div class="contacts-list">
                    <div class="contact-card">
                        <div class="contact-avatar">
                            <img src="../../assets/images/contatos/contato1.jpg" alt="">
                        </div>
                        <div class="contact-info">
                            <h3></h3>
                            <p><i class="fas fa-envelope"></i> </p>
                            <p><i class="fas fa-phone"></i> </p>
                        </div>
                        <div class="contact-tags">
                            <span class="tag"></span>
                        </div>
                        <div class="contact-actions">
                            <a href="contato.html" class="btn-view"><i class="fas fa-eye"></i></a>
                            <button class="btn-delete"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    
                    <div class="contact-card">
                        <div class="contact-avatar">
                            <img src="../../assets/images/contatos/contato2.jpg" alt="">
                        </div>
                        <div class="contact-info">
                            <h3></h3>
                            <p><i class="fas fa-envelope"></i> </p>
                            <p><i class="fas fa-phone"></i> </p>
                        </div>
                        <div class="contact-tags">
                            <span class="tag"></span>
                        </div>
                        <div class="contact-actions">
                            <a href="contato.html" class="btn-view"><i class="fas fa-eye"></i></a>
                            <button class="btn-delete"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    
                    <div class="contact-card">
                        <div class="contact-avatar">
                            <img src="../../assets/images/contatos/contato3.jpg" alt="">
                        </div>
                        <div class="contact-info">
                            <h3></h3>
                            <p><i class="fas fa-envelope"></i> </p>
                            <p><i class="fas fa-phone"></i> </p>
                        </div>
                        <div class="contact-tags">
                            <span class="tag"></span>
                        </div>
                        <div class="contact-actions">
                            <a href="contato.html" class="btn-view"><i class="fas fa-eye"></i></a>
                            <button class="btn-delete"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </section>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
