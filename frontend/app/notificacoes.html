<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header do App -->
    <header class="app-header">
        <div class="app-header-container">
            <div class="app-logo">
                <a href="dashboard.html"></a>
            </div>
            
            <div class="app-header-actions">
                <button class="app-notification-btn">
                    <i class="fas fa-bell"></i>
                    <span class="notification-count">3</span>
                </button>
                
                <div class="app-user-menu">
                    <button class="app-user-avatar">
                        <img src="../../assets/images/usuarios/avatar.jpg" alt="">
                        <span></span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="app-user-dropdown">
                        <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                        <a href="../autenticacao/login.html"><i class="fas fa-sign-out-alt"></i> Sair</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="app-main">
        <div class="app-container">
            
            <!-- Sidebar -->
            <aside class="app-sidebar">
                <nav class="app-nav">
                    <div class="app-nav-section">
                        <h3>Principal</h3>
                        <a href="dashboard.html">
                            <i class="fas fa-dashboard"></i> Dashboard
                        </a>
                        <a href="automacoes.html">
                            <i class="fas fa-robot"></i> Automações
                        </a>
                        <a href="contatos.html">
                            <i class="fas fa-users"></i> Contatos
                        </a>
                    </div>
                    
                    <div class="app-nav-section">
                        <h3>Configurações</h3>
                        <a href="notificacoes.html" class="active">
                            <i class="fas fa-bell"></i> Notificações
                        </a>
                        <a href="configuracoes.html">
                            <i class="fas fa-cog"></i> Configurações
                        </a>
                    </div>
                </nav>
            </aside>
            
            <!-- Conteúdo Principal -->
            <main class="app-content">
                
                <!-- Cabeçalho -->
                <div class="app-content-header">
                    <div>
                        <h1>Notificações</h1>
                        <p></p>
                    </div>
                    <div class="notifications-actions">
                        <button class="btn-mark-all">
                            <i class="fas fa-check-double"></i> Marcar Todas como Lidas
                        </button>
                    </div>
                </div>
                
                <!-- Filtros -->
                <div class="app-filters">
                    <button class="notification-filter active">Todas</button>
                    <button class="notification-filter">Não Lidas</button>
                    <button class="notification-filter">Mensagens</button>
                    <button class="notification-filter">Contatos</button>
                    <button class="notification-filter">Sistema</button>
                </div>
                
                <!-- Lista de Notificações -->
                <div class="notifications-list">
                    
                    <!-- Notificação 1 - Não Lida -->
                    <div class="notification-item unread">
                        <div class="notification-icon message">
                            <i class="fas fa-comment"></i>
                        </div>
                        <div class="notification-content">
                            <h3></h3>
                            <p></p>
                            <span class="notification-time"><i class="far fa-clock"></i> </span>
                        </div>
                        <button class="btn-mark-read">
                            <i class="fas fa-circle"></i>
                        </button>
                    </div>
                    
                    <!-- Notificação 2 - Não Lida -->
                    <div class="notification-item unread">
                        <div class="notification-icon contact">
                            <i class="fas fa-user-plus"></i>
                        </div>
                        <div class="notification-content">
                            <h3></h3>
                            <p></p>
                            <span class="notification-time"><i class="far fa-clock"></i> </span>
                        </div>
                        <button class="btn-mark-read">
                            <i class="fas fa-circle"></i>
                        </button>
                    </div>
                    
                    <!-- Notificação 3 - Não Lida -->
                    <div class="notification-item unread">
                        <div class="notification-icon system">
                            <i class="fas fa-cog"></i>
                        </div>
                        <div class="notification-content">
                            <h3></h3>
                            <p></p>
                            <span class="notification-time"><i class="far fa-clock"></i> </span>
                        </div>
                        <button class="btn-mark-read">
                            <i class="fas fa-circle"></i>
                        </button>
                    </div>
                    
                    <!-- Notificação 4 - Lida -->
                    <div class="notification-item">
                        <div class="notification-icon message">
                            <i class="fas fa-comment"></i>
                        </div>
                        <div class="notification-content">
                            <h3></h3>
                            <p></p>
                            <span class="notification-time"><i class="far fa-clock"></i> </span>
                        </div>
                    </div>
                </div>
                
                <!-- Preferências de Notificação -->
                <div class="notification-preferences">
                    <h2>Preferências de Notificação</h2>
                    
                    <div class="preference-item">
                        <div class="preference-info">
                            <h3>Notificações por E-mail</h3>
                            <p></p>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    
                    <div class="preference-item">
                        <div class="preference-info">
                            <h3>Notificações Push</h3>
                            <p></p>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    
                    <div class="preference-item">
                        <div class="preference-info">
                            <h3>Notificações de Novas Mensagens</h3>
                            <p></p>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    
                    <div class="preference-item">
                        <div class="preference-info">
                            <h3>Notificações de Novos Contatos</h3>
                            <p></p>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    
                    <div class="preference-item">
                        <div class="preference-info">
                            <h3>Notificações de Sistema</h3>
                            <p></p>
                        </div>
                        <label class="toggle-switch">
                            <input type="checkbox">
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                </div>
            </main>
        </div>
    </section>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
