<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header do App -->
    <header class="app-header">
        <div class="app-header-container">
            <div class="app-logo">
                <a href="dashboard.html"></a>
            </div>
            
            <div class="app-header-actions">
                <button class="app-search-btn">
                    <i class="fas fa-search"></i>
                </button>
                
                <button class="app-notification-btn">
                    <i class="fas fa-bell"></i>
                    <span class="notification-count">3</span>
                </button>
                
                <div class="app-user-menu">
                    <button class="app-user-avatar">
                        <img src="../../assets/images/usuarios/avatar.jpg" alt="">
                        <span></span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="app-user-dropdown">
                        <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                        <a href="perfil.html"><i class="fas fa-user"></i> Perfil</a>
                        <a href="../autenticacao/login.html"><i class="fas fa-sign-out-alt"></i> Sair</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="app-main">
        <div class="app-container">
            
            <!-- Sidebar -->
            <aside class="app-sidebar">
                <nav class="app-nav">
                    <div class="app-nav-section">
                        <h3>Principal</h3>
                        <a href="dashboard.html">
                            <i class="fas fa-dashboard"></i> Dashboard
                        </a>
                        <a href="automacoes.html">
                            <i class="fas fa-robot"></i> Automações
                        </a>
                        <a href="contatos.html">
                            <i class="fas fa-users"></i> Contatos
                        </a>
                    </div>
                    
                    <div class="app-nav-section">
                        <h3>Ferramentas</h3>
                        <a href="campanhas.html">
                            <i class="fas fa-bullhorn"></i> Campanhas
                        </a>
                        <a href="templates.html" class="active">
                            <i class="fas fa-file-alt"></i> Templates
                        </a>
                        <a href="midias.html">
                            <i class="fas fa-images"></i> Mídias
                        </a>
                    </div>
                </nav>
            </aside>
            
            <!-- Conteúdo Principal -->
            <main class="app-content">
                
                <!-- Cabeçalho -->
                <div class="app-content-header">
                    <div>
                        <h1>Templates</h1>
                        <p></p>
                    </div>
                    <button class="btn-primary">
                        <i class="fas fa-plus"></i> Novo Template
                    </button>
                </div>
                
                <!-- Filtros -->
                <div class="app-filters">
                    <button class="template-filter active">Todos</button>
                    <button class="template-filter">Texto</button>
                    <button class="template-filter">Imagem</button>
                    <button class="template-filter">Vídeo</button>
                    <button class="template-filter">Documento</button>
                </div>
                
                <!-- Grid de Templates -->
                <div class="templates-grid">
                    
                    <!-- Template 1 -->
                    <div class="template-card">
                        <div class="template-preview">
                            <div class="template-content">
                                <p></p>
                            </div>
                        </div>
                        <div class="template-info">
                            <h3></h3>
                            <span class="template-type">Texto</span>
                        </div>
                        <div class="template-actions">
                            <button class="btn-edit"><i class="fas fa-edit"></i></button>
                            <button class="btn-duplicate"><i class="fas fa-copy"></i></button>
                            <button class="btn-delete"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    
                    <!-- Template 2 -->
                    <div class="template-card">
                        <div class="template-preview image">
                            <img src="../../assets/images/templates/template1.jpg" alt="">
                        </div>
                        <div class="template-info">
                            <h3></h3>
                            <span class="template-type">Imagem</span>
                        </div>
                        <div class="template-actions">
                            <button class="btn-edit"><i class="fas fa-edit"></i></button>
                            <button class="btn-duplicate"><i class="fas fa-copy"></i></button>
                            <button class="btn-delete"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    
                    <!-- Template 3 -->
                    <div class="template-card">
                        <div class="template-preview video">
                            <i class="fas fa-play-circle"></i>
                        </div>
                        <div class="template-info">
                            <h3></h3>
                            <span class="template-type">Vídeo</span>
                        </div>
                        <div class="template-actions">
                            <button class="btn-edit"><i class="fas fa-edit"></i></button>
                            <button class="btn-duplicate"><i class="fas fa-copy"></i></button>
                            <button class="btn-delete"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    
                    <!-- Template 4 -->
                    <div class="template-card">
                        <div class="template-preview document">
                            <i class="fas fa-file-pdf"></i>
                        </div>
                        <div class="template-info">
                            <h3></h3>
                            <span class="template-type">Documento</span>
                        </div>
                        <div class="template-actions">
                            <button class="btn-edit"><i class="fas fa-edit"></i></button>
                            <button class="btn-duplicate"><i class="fas fa-copy"></i></button>
                            <button class="btn-delete"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </section>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
