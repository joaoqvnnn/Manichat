<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header do App -->
    <header class="app-header">
        <div class="app-header-container">
            <div class="app-logo">
                <a href="dashboard.html"></a>
            </div>
            
            <div class="app-header-actions">
                <button class="app-notification-btn">
                    <i class="fas fa-bell"></i>
                    <span class="notification-count">3</span>
                </button>
                
                <div class="app-user-menu">
                    <button class="app-user-avatar">
                        <img src="../../assets/images/usuarios/avatar.jpg" alt="">
                        <span></span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="app-user-dropdown">
                        <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                        <a href="../autenticacao/login.html"><i class="fas fa-sign-out-alt"></i> Sair</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="app-main">
        <div class="app-container">
            
            <!-- Sidebar -->
            <aside class="app-sidebar">
                <nav class="app-nav">
                    <div class="app-nav-section">
                        <h3>Principal</h3>
                        <a href="dashboard.html">
                            <i class="fas fa-dashboard"></i> Dashboard
                        </a>
                        <a href="automacoes.html">
                            <i class="fas fa-robot"></i> Automações
                        </a>
                        <a href="contatos.html">
                            <i class="fas fa-users"></i> Contatos
                        </a>
                    </div>
                    
                    <div class="app-nav-section">
                        <h3>Ferramentas</h3>
                        <a href="campanhas.html">
                            <i class="fas fa-bullhorn"></i> Campanhas
                        </a>
                        <a href="sequencias.html" class="active">
                            <i class="fas fa-list-ol"></i> Sequências
                        </a>
                        <a href="transmissoes.html">
                            <i class="fas fa-broadcast-tower"></i> Transmissões
                        </a>
                    </div>
                </nav>
            </aside>
            
            <!-- Conteúdo Principal -->
            <main class="app-content">
                
                <!-- Cabeçalho -->
                <div class="app-content-header">
                    <div>
                        <h1>Sequências</h1>
                        <p></p>
                    </div>
                    <button class="btn-primary">
                        <i class="fas fa-plus"></i> Nova Sequência
                    </button>
                </div>
                
                <!-- Lista de Sequências -->
                <div class="sequences-list">
                    
                    <!-- Sequência 1 -->
                    <div class="sequence-card">
                        <div class="sequence-header">
                            <div class="sequence-icon">
                                <i class="fas fa-list-ol"></i>
                            </div>
                            <div class="sequence-info">
                                <h3></h3>
                                <p> mensagens</p>
                            </div>
                            <span class="status-badge active">Ativa</span>
                        </div>
                        
                        <div class="sequence-steps">
                            <div class="sequence-step">
                                <span class="step-number">1</span>
                                <p></p>
                                <span class="step-delay"></span>
                            </div>
                            <div class="sequence-step">
                                <span class="step-number">2</span>
                                <p></p>
                                <span class="step-delay"></span>
                            </div>
                            <div class="sequence-step">
                                <span class="step-number">3</span>
                                <p></p>
                                <span class="step-delay"></span>
                            </div>
                        </div>
                        
                        <div class="sequence-actions">
                            <button class="btn-edit"><i class="fas fa-edit"></i> Editar</button>
                            <button class="btn-delete"><i class="fas fa-trash"></i> Excluir</button>
                        </div>
                    </div>
                    
                    <!-- Sequência 2 -->
                    <div class="sequence-card">
                        <div class="sequence-header">
                            <div class="sequence-icon">
                                <i class="fas fa-list-ol"></i>
                            </div>
                            <div class="sequence-info">
                                <h3></h3>
                                <p> mensagens</p>
                            </div>
                            <span class="status-badge paused">Pausada</span>
                        </div>
                        
                        <div class="sequence-steps">
                            <div class="sequence-step">
                                <span class="step-number">1</span>
                                <p></p>
                                <span class="step-delay"></span>
                            </div>
                            <div class="sequence-step">
                                <span class="step-number">2</span>
                                <p></p>
                                <span class="step-delay"></span>
                            </div>
                        </div>
                        
                        <div class="sequence-actions">
                            <button class="btn-edit"><i class="fas fa-edit"></i> Editar</button>
                            <button class="btn-delete"><i class="fas fa-trash"></i> Excluir</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </section>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
