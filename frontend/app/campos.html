<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header do App -->
    <header class="app-header">
        <div class="app-header-container">
            <div class="app-logo">
                <a href="dashboard.html"></a>
            </div>
            
            <div class="app-header-actions">
                <button class="app-notification-btn">
                    <i class="fas fa-bell"></i>
                    <span class="notification-count">3</span>
                </button>
                
                <div class="app-user-menu">
                    <button class="app-user-avatar">
                        <img src="../../assets/images/usuarios/avatar.jpg" alt="">
                        <span></span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="app-user-dropdown">
                        <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                        <a href="../autenticacao/login.html"><i class="fas fa-sign-out-alt"></i> Sair</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="app-main">
        <div class="app-container">
            
            <!-- Sidebar -->
            <aside class="app-sidebar">
                <nav class="app-nav">
                    <div class="app-nav-section">
                        <h3>Principal</h3>
                        <a href="dashboard.html">
                            <i class="fas fa-dashboard"></i> Dashboard
                        </a>
                        <a href="automacoes.html">
                            <i class="fas fa-robot"></i> Automações
                        </a>
                        <a href="contatos.html">
                            <i class="fas fa-users"></i> Contatos
                        </a>
                    </div>
                    
                    <div class="app-nav-section">
                        <h3>Ferramentas</h3>
                        <a href="campos.html" class="active">
                            <i class="fas fa-list"></i> Campos
                        </a>
                        <a href="segmentos.html">
                            <i class="fas fa-filter"></i> Segmentos
                        </a>
                    </div>
                </nav>
            </aside>
            
            <!-- Conteúdo Principal -->
            <main class="app-content">
                
                <!-- Cabeçalho -->
                <div class="app-content-header">
                    <div>
                        <h1>Campos Personalizados</h1>
                        <p></p>
                    </div>
                    <button class="btn-primary">
                        <i class="fas fa-plus"></i> Novo Campo
                    </button>
                </div>
                
                <!-- Lista de Campos -->
                <div class="fields-list">
                    
                    <!-- Campo Padrão -->
                    <div class="field-card">
                        <div class="field-icon">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="field-info">
                            <h3>Nome</h3>
                            <span class="field-type">Texto</span>
                        </div>
                        <span class="field-default">Padrão</span>
                    </div>
                    
                    <!-- Campo Padrão -->
                    <div class="field-card">
                        <div class="field-icon">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <div class="field-info">
                            <h3>E-mail</h3>
                            <span class="field-type">E-mail</span>
                        </div>
                        <span class="field-default">Padrão</span>
                    </div>
                    
                    <!-- Campo Padrão -->
                    <div class="field-card">
                        <div class="field-icon">
                            <i class="fas fa-phone"></i>
                        </div>
                        <div class="field-info">
                            <h3>Telefone</h3>
                            <span class="field-type">Telefone</span>
                        </div>
                        <span class="field-default">Padrão</span>
                    </div>
                    
                    <!-- Campo Personalizado -->
                    <div class="field-card custom">
                        <div class="field-icon">
                            <i class="fas fa-star"></i>
                        </div>
                        <div class="field-info">
                            <h3></h3>
                            <span class="field-type"></span>
                        </div>
                        <div class="field-actions">
                            <button class="btn-edit"><i class="fas fa-edit"></i></button>
                            <button class="btn-delete"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                    
                    <!-- Campo Personalizado -->
                    <div class="field-card custom">
                        <div class="field-icon">
                            <i class="fas fa-calendar"></i>
                        </div>
                        <div class="field-info">
                            <h3></h3>
                            <span class="field-type"></span>
                        </div>
                        <div class="field-actions">
                            <button class="btn-edit"><i class="fas fa-edit"></i></button>
                            <button class="btn-delete"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
                
                <!-- Formulário de Novo Campo -->
                <div class="new-field-form">
                    <h2>Novo Campo</h2>
                    
                    <form>
                        <div class="form-group">
                            <label for="campo-nome">Nome do Campo *</label>
                            <input type="text" id="campo-nome" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="campo-tipo">Tipo do Campo *</label>
                            <select id="campo-tipo" required>
                                <option value="">Selecione...</option>
                                <option value="texto">Texto</option>
                                <option value="numero">Número</option>
                                <option value="data">Data</option>
                                <option value="checkbox">Checkbox</option>
                                <option value="select">Seleção</option>
                            </select>
                        </div>
                        
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-save"></i> Salvar Campo
                        </button>
                    </form>
                </div>
            </main>
        </div>
    </section>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
