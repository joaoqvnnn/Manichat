<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header do App -->
    <header class="app-header">
        <div class="app-header-container">
            <div class="app-logo">
                <a href="dashboard.html"></a>
            </div>
            
            <div class="app-header-actions">
                <button class="app-notification-btn">
                    <i class="fas fa-bell"></i>
                    <span class="notification-count">3</span>
                </button>
                
                <div class="app-user-menu">
                    <button class="app-user-avatar">
                        <img src="../../assets/images/usuarios/avatar.jpg" alt="">
                        <span></span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="app-user-dropdown">
                        <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                        <a href="../autenticacao/login.html"><i class="fas fa-sign-out-alt"></i> Sair</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="app-main">
        <div class="app-container">
            
            <!-- Sidebar -->
            <aside class="app-sidebar">
                <nav class="app-nav">
                    <div class="app-nav-section">
                        <h3>Principal</h3>
                        <a href="dashboard.html">
                            <i class="fas fa-dashboard"></i> Dashboard
                        </a>
                    </div>
                    
                    <div class="app-nav-section">
                        <h3>Ferramentas</h3>
                        <a href="analytics.html">
                            <i class="fas fa-chart-bar"></i> Analytics
                        </a>
                        <a href="integracoes.html" class="active">
                            <i class="fas fa-plug"></i> Integrações
                        </a>
                    </div>
                </nav>
            </aside>
            
            <!-- Conteúdo Principal -->
            <main class="app-content">
                
                <!-- Cabeçalho -->
                <div class="app-content-header">
                    <div>
                        <h1>Integrações</h1>
                        <p></p>
                    </div>
                </div>
                
                <!-- Integrações Conectadas -->
                <div class="connected-integrations">
                    <h2>Conectadas</h2>
                    
                    <div class="integration-grid">
                        <div class="integration-card connected">
                            <div class="integration-icon whatsapp">
                                <i class="fab fa-whatsapp"></i>
                            </div>
                            <div class="integration-info">
                                <h3>WhatsApp</h3>
                                <p></p>
                            </div>
                            <span class="status-badge active">Conectado</span>
                        </div>
                        
                        <div class="integration-card connected">
                            <div class="integration-icon telegram">
                                <i class="fab fa-telegram"></i>
                            </div>
                            <div class="integration-info">
                                <h3>Telegram</h3>
                                <p></p>
                            </div>
                            <span class="status-badge active">Conectado</span>
                        </div>
                    </div>
                </div>
                
                <!-- Integrações Disponíveis -->
                <div class="available-integrations">
                    <h2>Disponíveis</h2>
                    
                    <div class="integration-grid">
                        <div class="integration-card">
                            <div class="integration-icon instagram">
                                <i class="fab fa-instagram"></i>
                            </div>
                            <div class="integration-info">
                                <h3>Instagram</h3>
                                <p></p>
                            </div>
                            <button class="btn-connect">Conectar</button>
                        </div>
                        
                        <div class="integration-card">
                            <div class="integration-icon facebook">
                                <i class="fab fa-facebook"></i>
                            </div>
                            <div class="integration-info">
                                <h3>Facebook</h3>
                                <p></p>
                            </div>
                            <button class="btn-connect">Conectar</button>
                        </div>
                        
                        <div class="integration-card">
                            <div class="integration-icon email">
                                <i class="fas fa-envelope"></i>
                            </div>
                            <div class="integration-info">
                                <h3>E-mail</h3>
                                <p></p>
                            </div>
                            <button class="btn-connect">Conectar</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </section>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
