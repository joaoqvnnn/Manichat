<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header do Builder -->
    <header class="builder-header">
        <div class="builder-header-container">
            <div class="builder-logo">
                <a href="../index.html">
                    <i class="fas fa-cubes"></i>
                    <span>Builder</span>
                </a>
            </div>
            
            <div class="builder-header-actions">
                <a href="../editar-fluxo.html" class="btn-back-flow">
                    <i class="fas fa-arrow-left"></i> Voltar ao Fluxo
                </a>
                <button class="btn-save-block"><i class="fas fa-save"></i> Salvar Bloco</button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="block-editor-main">
        <div class="block-editor-container">
            
            <!-- Cabeçalho -->
            <div class="block-editor-header">
                <div class="block-icon condition">
                    <i class="fas fa-share-alt"></i>
                </div>
                <h1>Configurar Ramificação</h1>
                <p></p>
            </div>
            
            <!-- Base da Ramificação -->
            <div class="form-section">
                <h2>Base da Ramificação</h2>
                
                <div class="form-group">
                    <label>Ramificar com base em</label>
                    <select>
                        <option value="">Selecione...</option>
                        <option value="resposta">Resposta do Usuário</option>
                        <option value="tag">Tag do Contato</option>
                        <option value="campo">Campo Personalizado</option>
                    </select>
                </div>
            </div>
            
            <!-- Ramos -->
            <div class="form-section">
                <h2>Ramos</h2>
                
                <div class="branches-list">
                    
                    <!-- Ramo 1 -->
                    <div class="branch-item">
                        <div class="branch-header">
                            <h3>Ramo 1</h3>
                            <button class="btn-remove-branch"><i class="fas fa-times"></i></button>
                        </div>
                        
                        <div class="form-group">
                            <label>Condição</label>
                            <input type="text" placeholder="Ex: resposta == 'sim'">
                        </div>
                        
                        <div class="form-group">
                            <label>Ação</label>
                            <select>
                                <option value="">Selecione...</option>
                                <option value="enviar-mensagem">Enviar Mensagem</option>
                                <option value="adicionar-tag">Adicionar Tag</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- Ramo 2 -->
                    <div class="branch-item">
                        <div class="branch-header">
                            <h3>Ramo 2</h3>
                            <button class="btn-remove-branch"><i class="fas fa-times"></i></button>
                        </div>
                        
                        <div class="form-group">
                            <label>Condição</label>
                            <input type="text" placeholder="Ex: resposta == 'nao'">
                        </div>
                        
                        <div class="form-group">
                            <label>Ação</label>
                            <select>
                                <option value="">Selecione...</option>
                                <option value="enviar-mensagem">Enviar Mensagem</option>
                                <option value="adicionar-tag">Adicionar Tag</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <button class="btn-add-branch">
                    <i class="fas fa-plus"></i> Adicionar Ramo
                </button>
            </div>
            
            <!-- Ramo Padrão -->
            <div class="form-section">
                <h2>Ramo Padrão</h2>
                
                <div class="form-group">
                    <label>Ação padrão (se nenhum ramo corresponder)</label>
                    <select>
                        <option value="">Selecione...</option>
                        <option value="enviar-mensagem">Enviar Mensagem</option>
                        <option value="encerrar">Encerrar Fluxo</option>
                        <option value="notificar">Notificar</option>
                    </select>
                </div>
            </div>
            
            <!-- Visualização -->
            <div class="form-section">
                <h2>Visualização</h2>
                
                <div class="branch-visualization">
                    <div class="branch-root">Início</div>
                    <div class="branch-lines">
                        <div class="branch-path">Ramo 1</div>
                        <div class="branch-path">Ramo 2</div>
                        <div class="branch-path default">Padrão</div>
                    </div>
                </div>
            </div>
            
            <!-- Botões -->
            <div class="form-actions">
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> Salvar Ramificação
                </button>
                
                <a href="../editar-fluxo.html" class="btn-cancel">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </div>
    </section>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
