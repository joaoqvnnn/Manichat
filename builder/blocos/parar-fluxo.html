<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header do Builder -->
    <header class="builder-header">
        <div class="builder-header-container">
            <div class="builder-logo">
                <a href="../index.html">
                    <i class="fas fa-cubes"></i>
                    <span>Builder</span>
                </a>
            </div>
            
            <div class="builder-header-actions">
                <a href="../editar-fluxo.html" class="btn-back-flow">
                    <i class="fas fa-arrow-left"></i> Voltar ao Fluxo
                </a>
                <button class="btn-save-block"><i class="fas fa-save"></i> Salvar Bloco</button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="block-editor-main">
        <div class="block-editor-container">
            
            <!-- Cabeçalho -->
            <div class="block-editor-header">
                <div class="block-icon action">
                    <i class="fas fa-stop-circle"></i>
                </div>
                <h1>Configurar Parada de Fluxo</h1>
                <p></p>
            </div>
            
            <!-- Tipo de Parada -->
            <div class="form-section">
                <h2>Tipo de Parada</h2>
                
                <div class="stop-type-options">
                    <label class="stop-type-card">
                        <input type="radio" name="tipo-parada" value="completa" checked>
                        <i class="fas fa-stop"></i>
                        <h3>Parada Completa</h3>
                        <p></p>
                    </label>
                    
                    <label class="stop-type-card">
                        <input type="radio" name="tipo-parada" value="pausa">
                        <i class="fas fa-pause"></i>
                        <h3>Pausa Temporária</h3>
                        <p></p>
                    </label>
                    
                    <label class="stop-type-card">
                        <input type="radio" name="tipo-parada" value="condicional">
                        <i class="fas fa-hand"></i>
                        <h3>Parada Condicional</h3>
                        <p></p>
                    </label>
                </div>
            </div>
            
            <!-- Configuração de Pausa -->
            <div class="form-section" id="config-pausa" style="display: none;">
                <h2>Configuração de Pausa</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Tempo de Pausa</label>
                        <input type="number" min="0" value="5">
                    </div>
                    
                    <div class="form-group">
                        <label>Unidade</label>
                        <select>
                            <option value="minutos" selected>Minutos</option>
                            <option value="horas">Horas</option>
                            <option value="dias">Dias</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Configuração de Parada Condicional -->
            <div class="form-section" id="config-condicional" style="display: none;">
                <h2>Configuração de Condição</h2>
                
                <div class="form-group">
                    <label>Parar se</label>
                    <select>
                        <option value="">Selecione a condição...</option>
                        <option value="tag-existe">Contato possui tag</option>
                        <option value="campo-igual">Campo é igual a</option>
                        <option value="resposta">Resposta contém</option>
                    </select>
                </div>
            </div>
            
            <!-- Mensagem Final -->
            <div class="form-section">
                <h2>Mensagem Final</h2>
                
                <div class="form-group">
                    <label>Enviar mensagem antes de parar?</label>
                    <select>
                        <option value="sim">Sim</option>
                        <option value="nao" selected>Não</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Mensagem</label>
                    <textarea rows="3" placeholder=""></textarea>
                </div>
            </div>
            
            <!-- Ações Adicionais -->
            <div class="form-section">
                <h2>Ações Adicionais</h2>
                
                <div class="form-group">
                    <label class="checkbox-container">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Notificar administrador
                    </label>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-container">
                        <input type="checkbox">
                        <span class="checkmark"></span>
                        Adicionar tag ao contato
                    </label>
                </div>
                
                <div class="form-group">
                    <label class="checkbox-container">
                        <input type="checkbox" checked>
                        <span class="checkmark"></span>
                        Registrar no histórico
                    </label>
                </div>
            </div>
            
            <!-- Resumo -->
            <div class="form-section">
                <h2>Resumo</h2>
                
                <div class="stop-summary">
                    <div class="summary-item">
                        <span>Tipo:</span>
                        <strong>Parada Completa</strong>
                    </div>
                    <div class="summary-item">
                        <span>Mensagem Final:</span>
                        <strong>Não</strong>
                    </div>
                </div>
            </div>
            
            <!-- Botões -->
            <div class="form-actions">
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> Salvar Parada
                </button>
                
                <a href="../editar-fluxo.html" class="btn-cancel">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </div>
    </section>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
