<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header do Builder -->
    <header class="builder-header">
        <div class="builder-header-container">
            <div class="builder-logo">
                <a href="../index.html">
                    <i class="fas fa-cubes"></i>
                    <span>Builder</span>
                </a>
            </div>
            
            <div class="builder-header-actions">
                <a href="../editar-fluxo.html" class="btn-back-flow">
                    <i class="fas fa-arrow-left"></i> Voltar ao Fluxo
                </a>
                <button class="btn-save-block"><i class="fas fa-save"></i> Salvar Bloco</button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="block-editor-main">
        <div class="block-editor-container">
            
            <!-- Cabeçalho -->
            <div class="block-editor-header">
                <div class="block-icon action">
                    <i class="fas fa-link"></i>
                </div>
                <h1>Configurar Webhook</h1>
                <p></p>
            </div>
            
            <!-- URL do Webhook -->
            <div class="form-section">
                <h2>URL do Webhook</h2>
                
                <div class="form-group">
                    <label>URL de Destino *</label>
                    <input type="url" placeholder="https://..." required>
                </div>
            </div>
            
            <!-- Método -->
            <div class="form-section">
                <h2>Método HTTP</h2>
                
                <div class="http-methods">
                    <label class="http-method-card">
                        <input type="radio" name="metodo-http" value="POST" checked>
                        <span class="method-badge post">POST</span>
                    </label>
                    
                    <label class="http-method-card">
                        <input type="radio" name="metodo-http" value="GET">
                        <span class="method-badge get">GET</span>
                    </label>
                    
                    <label class="http-method-card">
                        <input type="radio" name="metodo-http" value="PUT">
                        <span class="method-badge put">PUT</span>
                    </label>
                    
                    <label class="http-method-card">
                        <input type="radio" name="metodo-http" value="DELETE">
                        <span class="method-badge delete">DELETE</span>
                    </label>
                </div>
            </div>
            
            <!-- Headers -->
            <div class="form-section">
                <h2>Headers</h2>
                
                <div class="headers-list">
                    <div class="header-item">
                        <input type="text" placeholder="Chave" value="Content-Type">
                        <input type="text" placeholder="Valor" value="application/json">
                        <button class="btn-remove-header"><i class="fas fa-times"></i></button>
                    </div>
                </div>
                
                <button class="btn-add-header">
                    <i class="fas fa-plus"></i> Adicionar Header
                </button>
            </div>
            
            <!-- Body -->
            <div class="form-section">
                <h2>Body</h2>
                
                <div class="form-group">
                    <label>Tipo de Body</label>
                    <select>
                        <option value="json">JSON</option>
                        <option value="form">Form Data</option>
                        <option value="text">Texto</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Conteúdo do Body</label>
                    <textarea rows="6" placeholder='{"key": "value"}'></textarea>
                </div>
            </div>
            
            <!-- Variáveis -->
            <div class="form-section">
                <h2>Variáveis Disponíveis</h2>
                
                <div class="variables-list">
                    <button class="variable-btn">{{nome}}</button>
                    <button class="variable-btn">{{email}}</button>
                    <button class="variable-btn">{{telefone}}</button>
                    <button class="variable-btn">{{resposta}}</button>
                </div>
            </div>
            
            <!-- Teste -->
            <div class="form-section">
                <h2>Testar Webhook</h2>
                
                <button class="btn-test-webhook">
                    <i class="fas fa-paper-plane"></i> Enviar Teste
                </button>
                
                <div class="test-result" style="display: none;">
                    <span class="status-badge success">Sucesso - 200</span>
                </div>
            </div>
            
            <!-- Botões -->
            <div class="form-actions">
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> Salvar Webhook
                </button>
                
                <a href="../editar-fluxo.html" class="btn-cancel">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </div>
    </section>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
