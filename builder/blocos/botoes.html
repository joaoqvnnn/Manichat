<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="">
    <title></title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header do Builder -->
    <header class="builder-header">
        <div class="builder-header-container">
            <div class="builder-logo">
                <a href="../index.html">
                    <i class="fas fa-cubes"></i>
                    <span>Builder</span>
                </a>
            </div>
            
            <div class="builder-header-actions">
                <a href="../editar-fluxo.html" class="btn-back-flow">
                    <i class="fas fa-arrow-left"></i> Voltar ao Fluxo
                </a>
                <button class="btn-save-block"><i class="fas fa-save"></i> Salvar Bloco</button>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <section class="block-editor-main">
        <div class="block-editor-container">
            
            <!-- Cabeçalho -->
            <div class="block-editor-header">
                <div class="block-icon action">
                    <i class="fas fa-mouse-pointer"></i>
                </div>
                <h1>Configurar Botões</h1>
                <p></p>
            </div>
            
            <!-- Lista de Botões -->
            <div class="form-section">
                <h2>Botões</h2>
                
                <div class="buttons-list">
                    
                    <!-- Botão 1 -->
                    <div class="button-config-item">
                        <div class="button-config-header">
                            <h3>Botão 1</h3>
                            <button class="btn-remove-button"><i class="fas fa-times"></i></button>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label>Texto do Botão</label>
                                <input type="text" placeholder="">
                            </div>
                            
                            <div class="form-group">
                                <label>Tipo</label>
                                <select>
                                    <option value="resposta">Resposta Rápida</option>
                                    <option value="link">Link</option>
                                    <option value="telefone">Telefone</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>Valor / URL</label>
                            <input type="text" placeholder="">
                        </div>
                    </div>
                    
                    <!-- Botão 2 -->
                    <div class="button-config-item">
                        <div class="button-config-header">
                            <h3>Botão 2</h3>
                            <button class="btn-remove-button"><i class="fas fa-times"></i></button>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label>Texto do Botão</label>
                                <input type="text" placeholder="">
                            </div>
                            
                            <div class="form-group">
                                <label>Tipo</label>
                                <select>
                                    <option value="resposta">Resposta Rápida</option>
                                    <option value="link">Link</option>
                                    <option value="telefone">Telefone</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>Valor / URL</label>
                            <input type="text" placeholder="">
                        </div>
                    </div>
                </div>
                
                <button class="btn-add-button">
                    <i class="fas fa-plus"></i> Adicionar Botão
                </button>
            </div>
            
            <!-- Layout dos Botões -->
            <div class="form-section">
                <h2>Layout</h2>
                
                <div class="form-group">
                    <label>Disposição</label>
                    <select>
                        <option value="vertical">Vertical</option>
                        <option value="horizontal">Horizontal</option>
                    </select>
                </div>
            </div>
            
            <!-- Preview -->
            <div class="form-section">
                <h2>Pré-visualização</h2>
                
                <div class="buttons-preview">
                    <div class="preview-button">Botão 1</div>
                    <div class="preview-button">Botão 2</div>
                </div>
            </div>
            
            <!-- Botões -->
            <div class="form-actions">
                <button type="submit" class="btn-primary">
                    <i class="fas fa-save"></i> Salvar Botões
                </button>
                
                <a href="../editar-fluxo.html" class="btn-cancel">
                    <i class="fas fa-times"></i> Cancelar
                </a>
            </div>
        </div>
    </section>

    <script src="../../assets/js/script.js"></script>
</body>
</html>
